[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clarifysql"
version = "0.1.0"
description = "Teaching a small language model when to ask before it writes SQL (LMA group project 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
# the official test-suite evaluator has old-style regex strings that Python 3.12+ warns about
filterwarnings = ["ignore::SyntaxWarning"]
